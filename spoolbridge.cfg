#[gcode_macro Q2_BOX2_SLOT2]
#description: Spoolman spool in box 2 slot 2 (for Fluidd only, does nothing)
#variable_spool_id: None
#gcode:
#
#[gcode_macro Q2_BOX2_SLOT3]
#description: Spoolman spool in box 2 slot 3 (for Fluidd only, does nothing)
#variable_spool_id: None
#gcode:
#
#[gcode_macro Q2_BOX2_SLOT4]
#description: Spoolman spool in box 2 slot 4 (for Fluidd only, does nothing)
#variable_spool_id: None
#gcode:

# After a restart, copy the selections from saved_variables.cfg back into
# the macros so Fluidd shows them again. Touches no QIDI variables.
[delayed_gcode Q2_SPOOLBRIDGE_RESTORE]
initial_duration: 2
gcode:
  {% set svv = printer.save_variables.variables %}
  {% for m in ['Q2_SLOT1','Q2_SLOT2','Q2_SLOT3','Q2_SLOT4','Q2_EXTERN'] %}
    {% set sid = svv[(m ~ '__spool_id')|lower]|default(0)|int %}
    {% if sid > 0 %}
      SET_GCODE_VARIABLE MACRO={m} VARIABLE=spool_id VALUE={sid}
    {% endif %}
  {% endfor %}
