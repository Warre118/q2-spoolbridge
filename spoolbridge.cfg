#####################################################################
# spoolbridge.cfg - QIDI Box slot -> Spoolman spool mapping (QIDI Q2)
#
# These macros DO NOTHING. They only exist so Fluidd shows a spool
# selector per slot (Fluidd picks up macros with `variable_spool_id`).
# Fluidd also stores the selection in saved_variables.cfg as
# <macro name>__spool_id, so it survives a restart.
#
# The spoolbridge service (systemd) reads which slot is loaded
# (multi_color_controller.box.loaded_slot) and sets the matching spool
# as active in Moonraker. T0-T15, T_MANAGER and the box stay QIDI's:
# nothing is overridden and nothing is loaded from here.
#
#   slot0  -> Q2_SLOT1      slot4 -> Q2_BOX2_SLOT1   (second box only)
#   slot1  -> Q2_SLOT2      slot5 -> Q2_BOX2_SLOT2
#   slot2  -> Q2_SLOT3      slot6 -> Q2_BOX2_SLOT3
#   slot3  -> Q2_SLOT4      slot7 -> Q2_BOX2_SLOT4
#   slot16 -> Q2_EXTERN     (external spool holder)
#####################################################################

[gcode_macro Q2_SLOT1]
description: Spoolman spool in box slot 1 (for Fluidd only, does nothing)
variable_spool_id: None
gcode:

[gcode_macro Q2_SLOT2]
description: Spoolman spool in box slot 2 (for Fluidd only, does nothing)
variable_spool_id: None
gcode:

[gcode_macro Q2_SLOT3]
description: Spoolman spool in box slot 3 (for Fluidd only, does nothing)
variable_spool_id: None
gcode:

[gcode_macro Q2_SLOT4]
description: Spoolman spool in box slot 4 (for Fluidd only, does nothing)
variable_spool_id: None
gcode:

[gcode_macro Q2_EXTERN]
description: Spoolman spool on the external holder (for Fluidd only, does nothing)
variable_spool_id: None
gcode:

# --- Second QIDI Box: uncomment these four macros AND add their names to
# --- the list in Q2_SPOOLBRIDGE_RESTORE below.
#[gcode_macro Q2_BOX2_SLOT1]
#description: Spoolman spool in box 2 slot 1 (for Fluidd only, does nothing)
#variable_spool_id: None
#gcode:
